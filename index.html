<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Lavender Linux</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #c9b1ff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            border: 2px solid #c9b1ff;
            padding: 40px 60px;
            border-radius: 10px;
        }
        h1 { font-size: 3em; margin-bottom: 10px; }
        p { font-size: 1.2em; color: #a8a8d0; }
        .emoji { font-size: 4em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🌸</div>
        <h1>Hello from Lavender</h1>
        <p>Your distro, your rules.</p>
    </div>
</body>
</html>
